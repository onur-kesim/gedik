# Bağımlılık güncelleyici (G3). Yalnız her projede var olan ekosistem açık: GitHub Actions.
# Ölçüm (26 Eyl 2026): manifesti olmayan ekosistem (pip/pub/gradle) sessiz geçmiyor, koşum "failure" veriyor.
# Bu yüzden yığının satırı KUR'da eklenir — örnekler aşağıda yorumda; proje.toml [yigin] ne diyorsa onu aç.
version: 2
updates:
